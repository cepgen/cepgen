# Add-ons shipped as separate formulae (cepgen-<name>), rendered from cepgen-addon.rb.in by scripts/homebrew-formula.
#   name | add-on directory (CEPGEN_ADDONS) | library built | description | space-separated runtime dependencies
# Dependencies outside homebrew/core carry their tap (the formula must be installable from a third-party tap).
lhapdf|LHAPDFWrapper|CepGenLHAPDF|LHAPDF parton distribution functions wrappers|davidchall/hep/lhapdf
hepmc3|HepMC3Wrapper|CepGenHepMC3|HepMC3 event export wrappers|davidchall/hep/hepmc3
pythia8|Pythia8Wrapper|CepGenPythia8|Pythia 8 hadronisation wrappers|pythia
root|ROOTWrapper|CepGenRoot|ROOT wrappers|root

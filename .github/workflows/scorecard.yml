name: Scorecard

# Keep this workflow minimal: with publish_results enabled, Scorecard only accepts
# a restricted set of steps (checkout, scorecard-action, upload-sarif) and no top-level env/container.

on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 4'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

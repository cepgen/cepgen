name: Distribution packages

# On every published release: rebuild the RPMs on COPR, upload source packages to a Launchpad PPA and update the
# Homebrew formula of a tap repository (macOS).
# Also runnable by hand ("Run workflow"), e.g. to retry a single target.
#
# Files: .github/packaging/{cepgen.spec,debian/,homebrew/}, .github/scripts/{copr-custom,ppa-source,homebrew-formula}.
# The package version comes from the tag. Only tags containing this packaging can be built.
#
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. 1.3.1)"
        required: true
        type: string
      target:
        description: "What to run"
        type: choice
        options: [all, copr, ppa, homebrew]
        default: all
      ppa_revision:
        description: "PPA upload revision (bump it to re-upload the same release after a rejected upload)"
        type: string
        default: "1"

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  copr:
    name: COPR build
    if: ${{ vars.COPR_PROJECT != '' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'copr') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_id: ${{ steps.submit.outputs.build_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install and configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG" || { echo "::error::secret COPR_CONFIG is not set"; exit 1; }
          pipx install copr-cli
          mkdir -p ~/.config
          (umask 077; printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)

      # The script is stored in the COPR package definition, so it is refreshed for every release with the tag
      # to build. COPR clones the tag, builds the SRPM and builds it in every chroot enabled in the project.
      - name: Update the COPR package definition
        env:
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          {
            echo "TAG='$TAG'"
            echo "REPO_URL='https://github.com/${GITHUB_REPOSITORY}.git'"
            cat .github/scripts/copr-custom
          } > "$RUNNER_TEMP/copr-script"
          args=(--name cepgen --script "$RUNNER_TEMP/copr-script" --script-builddeps git)
          copr-cli edit-package-custom "${args[@]}" "$COPR_PROJECT" \
            || copr-cli add-package-custom "${args[@]}" "$COPR_PROJECT"

      # --nowait: do not keep this runner busy while COPR builds (the "assets" job waits for it).
      - name: Submit the build
        id: submit
        env:
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          out=$(copr-cli build-package --name cepgen --nowait "$COPR_PROJECT" | tee /dev/stderr)
          id=$(sed -nE 's/^Created builds?: *([0-9]+).*/\1/p' <<<"$out")
          test -n "$id" || { echo "::error::could not find the COPR build id"; exit 1; }
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

  ppa:
    name: Launchpad PPA upload
    if: ${{ vars.PPA != '' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'ppa') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dput dpkg-dev fakeroot gnupg cmake

      - name: Import the signing key
        id: key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "::error::secret PPA_GPG_PRIVATE_KEY is not set"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          uid=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"
          # the uploader identity (changelog trailer) must be the one registered on Launchpad
          echo "DEBFULLNAME=$(sed -E 's/ *(\(.*\))? *<.*//' <<<"$uid")" >> "$GITHUB_ENV"
          echo "DEBEMAIL=$(sed -E 's/.*<(.*)>.*/\1/' <<<"$uid")" >> "$GITHUB_ENV"
          # passphrase for non-interactive signing (empty file if the key has none)
          (umask 077; printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase")

      - name: Build the source packages
        env:
          SERIES: ${{ vars.PPA_SERIES || 'noble resolute' }}
          REVISION: ${{ inputs.ppa_revision || '1' }}
        run: .github/scripts/ppa-source "$TAG" "$RUNNER_TEMP/ppa" "$SERIES" "$REVISION"

      - name: Sign and upload
        env:
          PPA: ${{ vars.PPA }}
          FPR: ${{ steps.key.outputs.fingerprint }}
        run: |
          for changes in "$RUNNER_TEMP"/ppa/*/*_source.changes; do
            debsign -k"$FPR" \
              -p"gpg --batch --yes --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/gpg-passphrase" \
              "$changes"
            # Launchpad's FTP endpoint intermittently answers "550 ... internal server error":
            # retry with backoff (-f: dput otherwise refuses to resend after a failed attempt)
            for attempt in 1 2 3 4 5; do
              dput -f "$PPA" "$changes" && break
              [ "$attempt" -lt 5 ] || { echo "::error::upload of $changes failed"; exit 1; }
              echo "::warning::upload attempt $attempt failed, retrying"; sleep $((attempt * 30))
            done
          done

  homebrew:
    name: Homebrew tap update
    if: ${{ vars.HOMEBREW_TAP != '' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'homebrew') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # the template and script come from the commit running the workflow; the sources come from the tag tarball
      - uses: actions/checkout@v7

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # <user>/homebrew-<name> is installed as the tap <user>/<name>
      - name: Register the tap
        id: tap
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP }}
        run: |
          owner=${TAP_REPO%%/*}
          name=${TAP_REPO#*/homebrew-}
          mkdir -p "$(brew --repository)/Library/Taps/$owner"
          ln -s "$PWD/tap" "$(brew --repository)/Library/Taps/$owner/homebrew-$name"
          echo "name=$owner/$name" >> "$GITHUB_OUTPUT"

      - name: Render the formula
        run: .github/scripts/homebrew-formula "$TAG" tap/Formula/cepgen.rb

      - name: Build and test the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          TAP: ${{ steps.tap.outputs.name }}
        run: |
          brew install --build-from-source --verbose "$TAP/cepgen"
          brew test "$TAP/cepgen"

      - name: Push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cepgen.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "cepgen $TAG"
          git push

  # Waits for the COPR and Launchpad builds, then attaches the resulting .rpm and .deb files to the GitHub release.
  assets:
    name: Attach COPR/PPA packages to the release
    needs: [copr, ppa]
    # run if at least one of the two succeeded, even if the other was skipped or failed
    if: ${{ !cancelled() && (needs.copr.result == 'success' || needs.ppa.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download the RPMs from COPR
        if: ${{ needs.copr.result == 'success' }}
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          BUILD_ID: ${{ needs.copr.outputs.build_id }}
        run: |
          pipx install copr-cli
          mkdir -p ~/.config assets
          (umask 077; printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)
          copr-cli watch-build "$BUILD_ID"
          copr-cli download-build --rpms --dest assets "$BUILD_ID"
          # one sub-directory per chroot: flatten, keeping the chroot name in case file names clash
          find assets -mindepth 2 -name '*.rpm' ! -name '*.src.rpm' | while read -r f; do
            mv "$f" "assets/$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          find assets -mindepth 1 -type d -empty -delete
          find assets -name '*.rpm' | grep -q . || { echo "::error::no RPM downloaded from COPR build $BUILD_ID"; exit 1; }

      - name: Download the .deb files from the Launchpad PPA
        if: ${{ needs.ppa.result == 'success' }}
        env:
          PPA: ${{ vars.PPA }}
          SERIES: ${{ vars.PPA_SERIES || 'noble resolute' }}
          REVISION: ${{ inputs.ppa_revision || '1' }}
        run: |
          pip install launchpadlib
          .github/scripts/ppa-fetch-debs "$PPA" "$TAG" assets "$SERIES" "$REVISION"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per week instead of one per action; wait a few days before taking brand-new releases.
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 3

  # Enable if python/ gains a requirements.txt / pyproject.toml:
  # - package-ecosystem: "pip"
  #   directory: "/python"
  #   schedule:
  #     interval: "weekly"
